[project]
name = "oop-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ['I', 'F', 'E', 'W', 'UP', 'B', 'SIM']
