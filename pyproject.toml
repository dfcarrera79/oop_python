[project]
name = "proformas"
version = "0.6.0"
description = "Sistema generico de gestion de proformas (proyecto educativo UDEV0242)"
readme = "README.md"
authors = [
    { name = "dfcarrera79", email = "44879886+dfcarrera79@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flet>=1.0.0",
    "flet-desktop>=1.0.0",
    "pydantic>=2.13.4",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
